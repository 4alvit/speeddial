<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">Public repository CI and reviewed merging</title>
<desc id="desc">GitHub-hosted runners are the default. Five required browser targets validate Linux, Windows and macOS. The application aggregate includes all selected browser results and source checks. Independent metadata-only approval and a current-head reviewed merge complete the flow. A future self-hosted runner must be separately provisioned and isolated from private operations.</desc>
<defs><linearGradient id="header" x2="1" y2="1"><stop stop-color="#10223f"/><stop offset="1" stop-color="#283b68"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b46}.title{font-size:20px;font-weight:700}.body{font-size:16px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1120" height="760" rx="20" fill="#f4f7fc"/>
<path d="M20 0H1100Q1120 0 1120 20V122H0V20Q0 0 20 0" fill="url(#header)"/>
<text x="40" y="30" style="fill:#bfdbfe;font-size:12px;font-weight:700">ALVIT / SPEED DIAL</text>
<text x="40" y="70" style="fill:white;font-size:29px;font-weight:700">Public source checks and independent review</text>
<text x="40" y="101" style="fill:#dbeafe;font-size:16px">Hosted by default · private persistent runners stay outside the public repository</text>
<rect x="40" y="165" width="300" height="160" rx="14" fill="#eff6ff" stroke="#d8e2ef"/>
<text x="60" y="198" class="title">Source change</text>
<text x="60" y="229" class="body">Pull request or default-branch push</text>
<text x="60" y="255" class="body">Read-only source checkout</text>
<text x="60" y="281" class="body">Synthetic fixtures; no private data</text>
<rect x="410" y="165" width="300" height="160" rx="14" fill="#f5f3ff" stroke="#d8e2ef"/>
<text x="430" y="198" class="title">Selected browser matrix</text>
<text x="430" y="229" class="body">Linux: Chromium, Firefox, WebKit</text>
<text x="430" y="255" class="body">Windows: Chromium</text>
<text x="430" y="281" class="body">macOS: WebKit</text>
<rect x="780" y="165" width="300" height="160" rx="14" fill="#ecfdf5" stroke="#d8e2ef"/>
<text x="800" y="198" class="title">Application checks</text>
<text x="800" y="229" class="body">All selected browsers succeed</text>
<text x="800" y="255" class="body">Application + docs + policy tests</text>
<text x="800" y="281" class="body">Required aggregate status</text>
<path d="M340 245H410" class="line"/><path d="M710 245H780" class="line"/>
<rect x="40" y="380" width="485" height="160" rx="14" fill="#fffbeb" stroke="#d8e2ef"/>
<text x="60" y="414" class="title">Independent approval · hosted metadata job</text>
<text x="60" y="447" class="body">Review binds to the current PR head</text>
<text x="60" y="475" class="body">No PR source checkout; explicit bot-secret input</text>
<text x="60" y="503" class="body">Trusted author and same-repository eligibility</text>
<rect x="595" y="380" width="485" height="160" rx="14" fill="#f5f3ff" stroke="#d8e2ef"/>
<text x="615" y="414" class="title">Reviewed merge · hosted metadata job</text>
<text x="615" y="447" class="body">automerge label + independent current-head approval</text>
<text x="615" y="475" class="body">Successful required checks; no blocking review</text>
<text x="615" y="503" class="body">Recheck eligibility before merging the exact head</text>
<path d="M525 460H595" class="line"/><path d="M930 325V380" class="line"/>
<rect x="40" y="595" width="1040" height="108" rx="14" fill="#ffffff" stroke="#d8e2ef"/>
<text x="60" y="627" class="title">Optional runner switch</text>
<text x="60" y="655" class="body">Hosted extended runs: 35 targets. A separately isolated self-hosted runner selects 3 required / 9 extended Linux targets.</text>
<text x="60" y="681" class="body">Forks remain hosted. Changing runner mode never deploys the app, transfers a board or grants private infrastructure access.</text>
<text x="40" y="739" style="font-size:12px;fill:#475569">Repository administration and private runner provisioning remain in private operational repositories.</text>
</svg>
