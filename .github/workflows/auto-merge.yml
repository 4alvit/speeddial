# Trusted default-branch metadata only; no PR checkout or downloaded code.
name: Auto Merge PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft, closed]
  workflow_run:
    workflows: [CI, Auto Approve PRs]
    types: [completed]
  status:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pull-requests: write

# Each evaluation scans eligible PRs once and releases the metadata runner.
concurrency:
  group: reviewed-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login)) ||
      (contains(fromJSON('["workflow_run","status","workflow_dispatch","schedule"]'), github.event_name) &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@2149218f2b98dd1ccab0960690a39ab998c92ba9
    with:
      native-auto-merge: false
      reviewed-merge: true
      reviewed-single-pass: true
      merge-method: merge
      required-status-checks: Application checks
      # Private callers need this explicit pool for completion/status wakeups;
      # the shared public event profile intentionally leaves them hosted.
      runner-labels: ${{ github.event.repository.private && (vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (vars.CI_RUNNER_AUTOMATION_LABELS || '[]') || '["ubuntu-latest"]' }}
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
