# Trusted metadata only. Never check out or execute pull-request code here.
name: Auto Approve PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Same-repository PR number to re-evaluate
        type: string
        required: true
      expected-head:
        description: Exact reviewed 40-character PR head SHA
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: approve-${{ github.event.pull_request.number || inputs.pull-request-number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["4alvit","californiantiramisu","dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) &&
       !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@6b2d99519d513d2b871d2a845ddd6134dea4af2c
    with:
      # The private metadata pool also supports trusted default-branch recovery.
      # Enabled mode without labels fails admission rather than falling back.
      runner-labels: ${{ github.event.repository.private && (vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (vars.CI_RUNNER_AUTOMATION_LABELS || '[]') || '["ubuntu-latest"]' }}
      pull-request-number: ${{ github.event_name == 'workflow_dispatch' && inputs.pull-request-number || '' }}
      expected-head: ${{ github.event_name == 'workflow_dispatch' && inputs.expected-head || '' }}
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
