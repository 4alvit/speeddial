<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Swap two tiles, keep the rest</title>
<desc id="desc">In a 4 by 5 grid, dragging tile 2 onto tile 7 swaps only those two positions. The other 18 tiles do not move. Numbers are synthetic identities for this illustration, not bookmark titles.</desc>
