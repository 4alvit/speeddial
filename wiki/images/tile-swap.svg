<text x="60" y="507" font-size="19" style="fill:#172b46" font-weight="700" text-anchor="start">2 positions change · 18 stay put</text>
<text x="60" y="535" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">The grid stays fixed during dragging. Drop on a tile to exchange the two identities.</text>
<text x="60" y="557" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Dropping outside a tile or pressing Escape cancels; the keyboard can also swap positions.</text>
<text x="40" y="620" font-size="12" style="fill:#475569" font-weight="400" text-anchor="start">Illustrative identities in the default 4 × 5 layout. Swapping does not insert a tile or shift its neighbours.</text>
