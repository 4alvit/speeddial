<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc">
<title id="title">From public source to private deployment</title>
<desc id="desc">Pin public source, test isolated fixtures, rehearse migration, review private deployment configuration, deploy in a maintenance window, and verify acceptance. This is an operational procedure, not live telemetry.</desc>
<defs>
  <linearGradient id="header" x2="1" y2="1"><stop stop-color="#10223f"/><stop offset="1" stop-color="#283b68"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b46} .heading{font-weight:700} .muted{fill:#475569} .white{fill:#ffffff} .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);stroke-linejoin:round}</style>
<rect width="1120" height="710" rx="20" fill="#f4f7fc"/>
<path d="M20 0 H1100 Q1120 0 1120 20 V122 H0 V20 Q0 0 20 0" fill="url(#header)"/>
<rect y="118" width="1120" height="4" fill="url(#accent)"/>
<text x="40" y="29" font-size="12" style="fill:#bfdbfe" font-weight="700" text-anchor="start">ALVIT  /  SPEED DIAL</text>
<text x="40" y="69" font-size="29" style="fill:#ffffff" font-weight="700" text-anchor="start">From public source to private deployment</text>
<text x="40" y="99" font-size="16" style="fill:#dbeafe" font-weight="400" text-anchor="start">Six checkpoints keep application code and operational data separate.</text>
<rect x="40" y="170" width="160" height="220" rx="14" fill="#eff6ff" stroke="#d8e2ef"/>
<rect x="56" y="186" width="40" height="34" rx="8" fill="#2563eb" stroke="none"/>
<text x="76" y="210" font-size="17" style="fill:#ffffff" font-weight="700" text-anchor="middle">01</text>
<text x="56" y="255" font-size="20" style="fill:#172b46" font-weight="700" text-anchor="start">Pin source</text>
<text x="56" y="288" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Public commit</text>
<text x="56" y="313" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Verified image</text>
<text x="56" y="338" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Generic base</text>
<path d="M200 270 H216" class="line"/>
<rect x="216" y="170" width="160" height="220" rx="14" fill="#f5f3ff" stroke="#d8e2ef"/>
<rect x="232" y="186" width="40" height="34" rx="8" fill="#7c3aed" stroke="none"/>
<text x="252" y="210" font-size="17" style="fill:#ffffff" font-weight="700" text-anchor="middle">02</text>
<text x="232" y="255" font-size="20" style="fill:#172b46" font-weight="700" text-anchor="start">Test</text>
<text x="232" y="288" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Synthetic fixtures</text>
<text x="232" y="313" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Auth revocation</text>
<text x="232" y="338" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Docs + image scan</text>
<path d="M376 270 H392" class="line"/>
<rect x="392" y="170" width="160" height="220" rx="14" fill="#ecfdf5" stroke="#d8e2ef"/>
<rect x="408" y="186" width="40" height="34" rx="8" fill="#0f766e" stroke="none"/>
<text x="428" y="210" font-size="17" style="fill:#ffffff" font-weight="700" text-anchor="middle">03</text>
<text x="408" y="255" font-size="20" style="fill:#172b46" font-weight="700" text-anchor="start">Rehearse</text>
<text x="408" y="288" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Private snapshot</text>
<text x="408" y="313" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Offline migration</text>
<text x="408" y="338" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Compare state</text>
<path d="M552 270 H568" class="line"/>
<rect x="568" y="170" width="160" height="220" rx="14" fill="#fffbeb" stroke="#d8e2ef"/>
<rect x="584" y="186" width="40" height="34" rx="8" fill="#b45309" stroke="none"/>
<text x="604" y="210" font-size="17" style="fill:#ffffff" font-weight="700" text-anchor="middle">04</text>
<text x="584" y="255" font-size="20" style="fill:#172b46" font-weight="700" text-anchor="start">Review</text>
<text x="584" y="288" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Private overlay</text>
<text x="584" y="313" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Recovery ready</text>
<text x="584" y="338" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Maintenance plan</text>
<path d="M728 270 H744" class="line"/>
<rect x="744" y="170" width="160" height="220" rx="14" fill="#f5f3ff" stroke="#d8e2ef"/>
<rect x="760" y="186" width="40" height="34" rx="8" fill="#7c3aed" stroke="none"/>
<text x="780" y="210" font-size="17" style="fill:#ffffff" font-weight="700" text-anchor="middle">05</text>
<text x="760" y="255" font-size="20" style="fill:#172b46" font-weight="700" text-anchor="start">Cut over</text>
<text x="760" y="288" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Stop old writer</text>
<text x="760" y="313" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Migrate + restart</text>
<text x="760" y="338" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Keep rollback</text>
<path d="M904 270 H920" class="line"/>
<rect x="920" y="170" width="160" height="220" rx="14" fill="#ecfdf5" stroke="#d8e2ef"/>
<rect x="936" y="186" width="40" height="34" rx="8" fill="#0f766e" stroke="none"/>
<text x="956" y="210" font-size="17" style="fill:#ffffff" font-weight="700" text-anchor="middle">06</text>
<text x="936" y="255" font-size="20" style="fill:#172b46" font-weight="700" text-anchor="start">Accept</text>
<text x="936" y="288" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Auth + images</text>
<text x="936" y="313" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Preserve board</text>
<text x="936" y="338" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="start">Record outcome</text>
<rect x="40" y="450" width="320" height="166" rx="14" fill="#eff6ff" stroke="#d8e2ef"/>
<rect x="40" y="468" width="4" height="130" rx="2" fill="#2563eb" stroke="none"/>
<text x="60" y="482" font-size="19" style="fill:#172b46" font-weight="700" text-anchor="start">Isolated preparation</text>
<text x="60" y="510" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Keep production unchanged.</text>
<text x="60" y="532" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Use separate data and credentials.</text>
<text x="60" y="554" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Validate before replacing files.</text>
<text x="60" y="576" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Keep secret values out of output.</text>
<rect x="400" y="450" width="320" height="166" rx="14" fill="#fffbeb" stroke="#d8e2ef"/>
<rect x="400" y="468" width="4" height="130" rx="2" fill="#b45309" stroke="none"/>
<text x="420" y="482" font-size="19" style="fill:#172b46" font-weight="700" text-anchor="start">Operational boundary</text>
<text x="420" y="510" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Review the exact deployment plan.</text>
<text x="420" y="532" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Protect the old recovery set.</text>
<text x="420" y="554" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Restart to load new credentials.</text>
<text x="420" y="576" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Verify old sessions are rejected.</text>
<rect x="760" y="450" width="320" height="166" rx="14" fill="#fff1f2" stroke="#d8e2ef"/>
<rect x="760" y="468" width="4" height="130" rx="2" fill="#be123c" stroke="none"/>
<text x="780" y="482" font-size="19" style="fill:#172b46" font-weight="700" text-anchor="start">Source boundary</text>
<text x="780" y="510" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Public source has a clean history.</text>
<text x="780" y="532" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Private records remain separate.</text>
<text x="780" y="554" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Pin the public source revision.</text>
<text x="780" y="576" font-size="15" style="fill:#475569" font-weight="400" text-anchor="start">Do not duplicate application code.</text>
<text x="40" y="690" font-size="12" style="fill:#475569" font-weight="400" text-anchor="start">Ordered checkpoints, not elapsed time or completed production work. Each deployment needs its own acceptance record.</text>
</svg>
