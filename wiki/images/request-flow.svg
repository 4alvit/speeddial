<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">A token for each page visit</title>
<desc id="desc">A valid access token on the page query establishes an eight-hour cookie. Assets and API use the cookie. A bare page still returns 404. Credential or epoch rotation invalidates previous cookies after restart.</desc>
<defs>
  <linearGradient id="header" x2="1" y2="1"><stop stop-color="#10223f"/><stop offset="1" stop-color="#283b68"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b46} .heading{font-weight:700} .muted{fill:#475569} .white{fill:#ffffff} .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);stroke-linejoin:round}</style>
<rect width="1120" height="700" rx="20" fill="#f4f7fc"/>
<path d="M20 0 H1100 Q1120 0 1120 20 V122 H0 V20 Q0 0 20 0" fill="url(#header)"/>
<rect y="118" width="1120" height="4" fill="url(#accent)"/>
<text x="40" y="29" font-size="12" style="fill:#bfdbfe" font-weight="700" text-anchor="start">ALVIT  /  SPEED DIAL</text>
<text x="40" y="69" font-size="29" style="fill:#ffffff" font-weight="700" text-anchor="start">A token for each page visit</text>
<text x="40" y="99" font-size="16" style="fill:#dbeafe" font-weight="400" text-anchor="start">A signed session authorizes assets and API; token, key or epoch rotation revokes it.</text>
<rect x="60" y="150" width="200" height="58" rx="14" fill="#eff6ff" stroke="#d8e2ef"/>
<rect x="60" y="168" width="4" height="22" rx="2" fill="#2563eb" stroke="none"/>
<text x="80" y="182" font-size="19" style="fill:#172b46" font-weight="700" text-anchor="start">Browser</text>
<path d="M160 210 V638" stroke="#b7c6dc" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="460" y="150" width="200" height="58" rx="14" fill="#f5f3ff" stroke="#d8e2ef"/>
<rect x="460" y="168" width="4" height="22" rx="2" fill="#7c3aed" stroke="none"/>
<text x="480" y="182" font-size="19" style="fill:#172b46" font-weight="700" text-anchor="start">Application</text>
<path d="M560 210 V638" stroke="#b7c6dc" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="860" y="150" width="200" height="58" rx="14" fill="#ecfdf5" stroke="#d8e2ef"/>
<rect x="860" y="168" width="4" height="22" rx="2" fill="#0f766e" stroke="none"/>
<text x="880" y="182" font-size="19" style="fill:#172b46" font-weight="700" text-anchor="start">SQLite / files</text>
<path d="M960 210 V638" stroke="#b7c6dc" stroke-width="2" stroke-dasharray="5 6"/>
<text x="40" y="245" font-size="13" style="fill:#475569" font-weight="700" text-anchor="start">1  Establish the session</text>
<text x="40" y="360" font-size="13" style="fill:#475569" font-weight="700" text-anchor="start">2  Read authorized data</text>
<text x="40" y="530" font-size="13" style="fill:#475569" font-weight="700" text-anchor="start">3  Recheck every page visit</text>
<path d="M160 283 H560" class="line"/>
<text x="360.0" y="273" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="middle">GET /?access=&lt;token&gt;</text>
<path d="M560 327 H160" class="line"/>
<text x="360.0" y="317" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="middle">200 + signed cookie (8 hours)</text>
<path d="M160 400 H560" class="line"/>
<text x="360.0" y="390" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="middle">GET assets / API + cookie</text>
<path d="M560 400 H960" class="line"/>
<text x="760.0" y="390" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="middle">Authorized read</text>
<path d="M960 446 H560" class="line"/>
<text x="760.0" y="436" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="middle">Current data / file</text>
<path d="M560 491 H160" class="line"/>
<text x="360.0" y="481" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="middle">200 + no-store response</text>
<path d="M160 571 H560" class="line"/>
<text x="360.0" y="561" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="middle">GET / without query + cookie</text>
<path d="M560 617 H160" class="line"/>
<text x="360.0" y="607" font-size="14" style="fill:#172b46" font-weight="400" text-anchor="middle">404 — page token still required</text>
<text x="40" y="680" font-size="12" style="fill:#475569" font-weight="400" text-anchor="start">The token shown is a placeholder. Never publish a real entry URL; GET /healthz is intentionally public.</text>
</svg>
