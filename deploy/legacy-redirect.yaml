apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: legacy-speeddial
  namespace: speeddial
spec:
  redirectRegex:
    regex: '^https?://legacy\.example\.com/saved/speeddial\.htm(\?.*)?$'
    # Preserve only a query the caller supplied; never add the page access key.
    replacement: https://speeddial.example.com/${1}
    permanent: false
---
# Optional example: enable only after configuring the private source hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-speeddial
  namespace: speeddial
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: speeddial-legacy-speeddial@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: legacy.example.com
      http:
        paths:
          - path: /saved/speeddial.htm
            pathType: Exact
            backend:
              service:
                name: speeddial
                port:
                  number: 3000
