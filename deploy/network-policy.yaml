apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: speeddial
  namespace: speeddial
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: speeddial
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
              tunnel: speeddial
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Screenshot traffic is public HTTP(S) only. Private/LAN addresses and
    # metadata networks stay blocked even after DNS rebinding or redirects.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
# Extend the existing connector's egress by this one namespace/service port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: speeddial-egress
  namespace: cloudflared
spec:
  podSelector:
    matchLabels:
      app: cloudflared
      tunnel: speeddial
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: speeddial
          podSelector:
            matchLabels:
              app.kubernetes.io/name: speeddial
      ports:
        - protocol: TCP
          port: 3000
