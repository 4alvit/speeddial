apiVersion: apps/v1
kind: Deployment
metadata:
  name: speeddial
  namespace: speeddial
  labels:
    app.kubernetes.io/name: speeddial
    app.kubernetes.io/version: "1.1.0"
spec:
  replicas: 1
  # A single process owns the SQLite database. Preserve the PVC on updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: speeddial
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speeddial
        app.kubernetes.io/version: "1.1.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: speeddial
          # Replace in a private overlay with the verified security-cutover digest.
          image: registry.example.invalid/speeddial:replace-with-verified-release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            - name: CHROMIUM_PATH
              value: /usr/bin/chromium
            - name: PUBLIC_ORIGIN
              value: https://speeddial.example.com
            - name: ACCESS_TOKEN_FILE
              value: /run/secrets/speeddial/access-token
            - name: SESSION_KEY_FILE
              value: /run/secrets/speeddial/session-key
            - name: AUTH_EPOCH
              value: "1"
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: access
              mountPath: /run/secrets/speeddial
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: access
          secret:
            secretName: speeddial-access
            optional: false
            defaultMode: 0440
            items:
              - key: access-token
                path: access-token
              - key: session-key
                path: session-key
        - name: data
          persistentVolumeClaim:
            claimName: speeddial-data
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
